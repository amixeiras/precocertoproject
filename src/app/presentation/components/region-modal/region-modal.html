@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs transition-opacity animate-fade-in">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-100">
      <!-- Header -->
      <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </div>
          <div>
            <h3 class="text-lg font-bold text-slate-900">Selecione sua Região</h3>
            <p class="text-xs text-slate-500">Exibiremos os preços dos mercados mais próximos a você</p>
          </div>
        </div>
        <button
          type="button"
          (click)="onClose()"
          class="text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition-colors"
          aria-label="Fechar"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Content -->
      <div class="p-6 space-y-4">
        <!-- Detect GPS Button -->
        <button
          type="button"
          (click)="onDetect()"
          [disabled]="regionState.isDetecting()"
          class="w-full flex items-center justify-center gap-2.5 py-3 px-4 rounded-xl border-2 border-dashed border-emerald-500/50 bg-emerald-50/50 hover:bg-emerald-50 text-emerald-800 font-semibold text-sm transition-all hover:border-emerald-600 disabled:opacity-50"
        >
          @if (regionState.isDetecting()) {
            <svg class="animate-spin w-5 h-5 text-emerald-600" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Detectando localização via GPS...</span>
          } @else {
            <svg class="w-5 h-5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>Usar minha localização atual (GPS)</span>
          }
        </button>

        @if (regionState.errorMessage()) {
          <div class="p-3 text-xs rounded-xl bg-amber-50 text-amber-800 border border-amber-200 flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>{{ regionState.errorMessage() }}</span>
          </div>
        }

        <!-- Region List -->
        <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Regiões Atendidas</p>
          @for (region of regionState.availableRegions(); track region.idValue) {
            <button
              type="button"
              (click)="onSelect(region)"
              [class.border-emerald-500]="regionState.currentRegion()?.idValue === region.idValue"
              [class.bg-emerald-50]="regionState.currentRegion()?.idValue === region.idValue"
              [class.text-emerald-900]="regionState.currentRegion()?.idValue === region.idValue"
              class="w-full text-left p-3.5 rounded-xl border border-slate-200 hover:border-emerald-300 hover:bg-slate-50/80 transition-all flex items-center justify-between group"
            >
              <div>
                <p class="text-sm font-semibold text-slate-800 group-hover:text-emerald-700">{{ region.name }}</p>
                <p class="text-xs text-slate-500">Estado: {{ region.state }} &bull; Raio: {{ region.radiusKm }} km</p>
              </div>
              @if (regionState.currentRegion()?.idValue === region.idValue) {
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-600 text-white">
                  Ativa
                </span>
              }
            </button>
          }
        </div>
      </div>
    </div>
  </div>
}
